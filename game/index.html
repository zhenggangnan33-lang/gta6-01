<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>VERDE BAY — a tiny open-world crime story</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0d12; height: 100%; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { width: 100vw; height: 100vh; display: block; image-rendering: auto; touch-action: none; }
  #touch { position: fixed; inset: auto 0 0 0; display: none; justify-content: space-between; padding: 12px; pointer-events: none; }
  #touch button { pointer-events: auto; width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.5); background: rgba(20,22,30,0.55); color: #fff; font: bold 18px system-ui, sans-serif; }
  @media (pointer: coarse) { #touch { display: flex; } }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
<div id="touch">
  <button data-key="KeyE">E</button>
  <button data-key="KeyF">F</button>
  <button data-key="Space">BRK</button>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
